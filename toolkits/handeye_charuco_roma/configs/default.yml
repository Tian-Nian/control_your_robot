# roma 工位手眼：管家已起时 Observe 只读。不要再开 Pipeline MarvinArmController。
# 板参数与 ../handeye_charuco/configs/default.yml 保持一致。

roma_root: null              # null = ../roma
sdk_root: null               # null = ../X-Robot-Pipeline_new/third_party/TJ_FX_ROBOT_CONTRL_SDK
kine_cfg: null               # null = SDK CommonConfig/ccs_m6_40.MvKDCfg

arm_side: left
arm_device: left_arm         # 花名册 controller 名（jinli-v1 只有左臂）
camera_device: null          # null = 按 setup/role 解析：ETH→cam_head，EIH+left→cam_left
setup: eye_to_hand           # eye_to_hand 头相机看法兰上的板；eye_in_hand 腕相机看固定板
camera_role: auto            # auto：ETH=head，EIH+left=left_wrist
# Observe 跟 GMSL 槽走：当前目标 1280×800。内参按实际画面标定。

board:
  # 现用板：14 列 × 10 行，格 40 mm，DICT_5X5_100，非 legacy
  squares_x: 14              # Columns（用户说的 10×14 是 10 行 × 14 列）
  squares_y: 10              # Rows
  square_length_m: 0.040     # Checker Width 40 mm
  marker_length_m: 0.028     # 40 mm × 0.7
  dictionary: DICT_5X5_100
  legacy_pattern: false
  print_scale: 1.0

capture:
  min_corners: 8
  max_reproj_px: 3.0
  grab_frames: 4
  min_samples: 12
  display: false             # 无 X11 的工位不要开
  ready_timeout_s: 15.0
  settle_s: 1.0              # 回放到点后先停再拍照
  gap_s: 1.0                 # 拍完再等，然后去下一点
  replay_max_deg_s: 20.0

solver:
  refine: true
  reject_outliers: true
  refine_intrinsics: true
  max_rms_trans_m: 0.008
  max_rms_rot_deg: 1.5

verify:
  max_rms_trans_m: 0.008
  max_rms_rot_deg: 1.5
  max_rms_reproj_px: 4.0
  max_rms_origin_m: 0.010
