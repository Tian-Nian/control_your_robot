[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "control_your_robot"
version = "1.0"
description = "control_your_robot open source repo"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "tqdm",
    "scipy",
    "numpy",
    "h5py",
    "pyrealsense2",
    "opencv-python",
    "keyboard",
    "pyyaml",
    "seaborn",
    "msgpack>=1.0.5",
]

[project.optional-dependencies]
sim = ["rerun-sdk"]
harness-mujoco = ["mujoco>=3.3,<4", "rerun-sdk"]
harness-assets = ["trimesh>=4,<6", "pycollada>=0.8", "fast-simplification>=0.1"]

[project.urls]
Repository = "https://github.com/Tian-Nian/control_your_robot"

[project.scripts]
cyr = "robot.runtime.__main__:main"

# ⭐ 关键配置：告诉 setuptools，包在 src/ 下面
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robot.harness" = ["prompts/*.txt"]

# 你原来就有的
[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["src"]
pythonpath = ["src"]
